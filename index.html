<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Flash Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one index card centered on a desk, deck controls above, study buttons below */
:root {
  --desk: #e7eef6;
  --card: #ffffff;
  --rule: #c9daf0;
  --margin-line: #e2626a;
  --ink: #1d2a3b;
  --muted: #5a6b82;
  --accent: #2456c9;      /* cobalt pen */
  --accent-ink: #ffffff;
  --pencil: #f3b928;      /* pencil yellow */
  --good: #1f8a5b;
  --warn: #c2571b;
  --chip: #dbe6f5;
  --shadow: 0 1px 0 rgba(29,42,59,.08), 0 10px 28px -12px rgba(29,42,59,.35);
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121a26; --card: #1c2737; --rule: #2a3a52; --margin-line: #d0545d;
    --ink: #eaf1fb; --muted: #9db0c9; --accent: #7ea6ff; --accent-ink: #0d1626;
    --pencil: #f3c24a; --good: #4cc48d; --warn: #f08a4b; --chip: #2a3a52;
    --shadow: 0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121a26; --card: #1c2737; --rule: #2a3a52; --margin-line: #d0545d;
  --ink: #eaf1fb; --muted: #9db0c9; --accent: #7ea6ff; --accent-ink: #0d1626;
  --pencil: #f3c24a; --good: #4cc48d; --warn: #f08a4b; --chip: #2a3a52;
  --shadow: 0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 32px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

header { display: grid; gap: 6px; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.3rem);
  line-height: 1.05; margin: 0; text-wrap: balance;
}
h1 .g { color: var(--accent); }
h1 .s { background: linear-gradient(transparent 60%, var(--pencil) 60%); padding: 0 .1em; }
.sub { margin: 0; color: var(--muted); max-width: 60ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button {
  font: 700 .9rem var(--body); border: 0; background: transparent; color: var(--ink);
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.small-btn {
  font: 700 .9rem var(--body); border: 2px solid var(--rule); background: var(--card); color: var(--ink);
  padding: 6px 12px; border-radius: 10px; cursor: pointer;
}
.small-btn:hover { border-color: var(--accent); }

.meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--chip); border-radius: 99px; margin-left: 12px; overflow: hidden; max-width: 220px; }
.bar span { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }

/* The index card */
.stage { perspective: 1400px; }
.card {
  position: relative; width: 100%; min-height: 330px; cursor: pointer;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1);
  border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; display: block;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background-color: var(--card); border-radius: 10px; box-shadow: var(--shadow);
  background-image:
    linear-gradient(var(--margin-line), var(--margin-line)),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-size: 100% 2px, 100% 100%;
  background-position: 0 58px, 0 60px;
  background-repeat: no-repeat, repeat;
  padding: 18px 22px 22px; display: flex; flex-direction: column;
}
.back { transform: rotateY(180deg); }
.tag {
  align-self: flex-start; font: 700 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); height: 30px; display: flex; align-items: center; gap: 8px;
}
.tag .pill { background: var(--pencil); color: #2b2100; padding: 2px 8px; border-radius: 6px; letter-spacing: .05em; }
.front-body { flex: 1; display: grid; place-items: center; text-align: center; gap: 8px; padding-top: 10px; }
.word {
  font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 11vw, 4rem);
  line-height: 1; overflow-wrap: anywhere;
}
.root-hl { color: var(--accent); }
.prompt-def { font-size: clamp(1.15rem, 4vw, 1.45rem); max-width: 30ch; }
.hint { color: var(--muted); font-size: .9rem; }

.back-body { flex: 1; display: grid; gap: 12px; align-content: start; padding-top: 14px; min-width: 0; }
.back-word { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.1; }
.def { font-size: 1.15rem; margin: 0; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.part {
  display: inline-grid; text-align: center; background: var(--chip); border-radius: 8px; padding: 4px 10px; line-height: 1.2;
}
.part b { font-family: var(--display); font-size: 1.1rem; }
.part small { color: var(--muted); font-size: .78rem; }
.part.root { background: var(--accent); color: var(--accent-ink); }
.part.root small { color: var(--accent-ink); opacity: .85; }
.plus { color: var(--muted); font-weight: 700; }
.example { margin: 0; font-style: italic; color: var(--muted); }
.example::before { content: "“"; } .example::after { content: "”"; }

.say {
  position: absolute; top: 12px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer;
  display: grid; place-items: center; z-index: 2;
}
.say:hover { border-color: var(--accent); color: var(--accent); }
.say svg { width: 20px; height: 20px; }

.study { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; }
.nav, .judge {
  font: 700 1rem var(--body); border-radius: 12px; padding: 14px 12px; cursor: pointer; border: 2px solid transparent;
}
.nav { background: var(--card); color: var(--ink); border-color: var(--rule); min-width: 52px; }
.judge.learn { background: var(--card); color: var(--warn); border-color: var(--warn); }
.judge.know { background: var(--good); color: #fff; }
:root[data-theme="dark"] .judge.know { color: #0c1a12; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .judge.know { color: #0c1a12; } }
button:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }

.done {
  background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 28px 22px; text-align: center;
  display: grid; gap: 10px; justify-items: center;
}
.done h2 { font-family: var(--display); margin: 0; font-size: 1.8rem; }
.done p { margin: 0; color: var(--muted); }

.keys { color: var(--muted); font-size: .82rem; text-align: center; margin: 0; }

@media (max-width: 460px) {
  .study { grid-template-columns: 1fr 1fr; }
  .nav.prev { order: 3; } .nav.next { order: 4; }
  .card { min-height: 360px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .bar span { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Words that <span class="g">write</span> &amp; <span class="s">draw</span></h1>
    <p class="sub">Tap the card to flip it. Every word here has a root that means “write”: <b>graph/gram</b> or <b>scrib/script</b>.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Which cards">
      <button id="set-all" aria-pressed="true" data-set="all">All</button>
      <button id="set-words" aria-pressed="false" data-set="words">Words</button>
      <button id="set-roots" aria-pressed="false" data-set="roots">Roots</button>
    </div>
    <div class="seg" role="group" aria-label="What shows first">
      <button id="dir-word" aria-pressed="true" data-dir="word">Word first</button>
      <button id="dir-def" aria-pressed="false" data-dir="def">Meaning first</button>
    </div>
    <button class="small-btn" id="shuffle">Shuffle</button>
  </div>

  <div class="meta">
    <span id="count">Card 1 of 14</span>
    <span style="display:flex;align-items:center;flex:1;justify-content:flex-end">
      <span id="known">0 learned</span><span class="bar"><span id="bar-fill"></span></span>
    </span>
  </div>

  <div class="stage" id="stage">
    <button class="card" id="card" aria-label="Flashcard, press to flip">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </button>
  </div>

  <div class="done" id="done" hidden>
    <h2>You learned them all!</h2>
    <p>Every card in this set is marked “Got it.”</p>
    <button class="small-btn" id="restart">Practice again</button>
  </div>

  <div class="study" id="study">
    <button class="nav prev" id="prev" aria-label="Previous card">←</button>
    <button class="judge learn" id="learn">Still learning</button>
    <button class="judge know" id="know">Got it!</button>
    <button class="nav next" id="next" aria-label="Next card">→</button>
  </div>
  <p class="keys">Keyboard: Space flips · ← → move · 1 still learning · 2 got it</p>
</div>

<script>
const CARDS = [
  { id:"graph-root", type:"root", word:"graph / gram", hl:"graph / gram", origin:"Greek root",
    def:"A word part that means “to write” or “to draw.”",
    parts:[["graph","write, draw",1],["gram","something written or drawn",1]],
    ex:"photograph, autograph, biography, diagram, grammar" },
  { id:"scrib-root", type:"root", word:"scrib / script", hl:"scrib / script", origin:"Latin root",
    def:"A word part that means “to write.”",
    parts:[["scribe","write",1],["script","written",1]],
    ex:"describe, subscribe, prescription, manuscript" },
  { id:"subscribe", type:"word", word:"subscribe", hl:"scribe",
    def:"To sign up to get something again and again, like a magazine or a channel.",
    parts:[["sub","under"],["scribe","write",1]],
    ex:"Mom subscribed to a cooking magazine that comes every month." },
  { id:"grammar", type:"word", word:"grammar", hl:"gram",
    def:"The rules for how words fit together to make sentences.",
    parts:[["gram","written letters",1],["mar","the art of"]],
    ex:"Good grammar helps people understand your writing." },
  { id:"diagram", type:"word", word:"diagram", hl:"gram",
    def:"A drawing that shows the parts of something or how it works.",
    parts:[["dia","across, through"],["gram","drawn",1]],
    ex:"We labeled a diagram of a plant’s roots, stem and leaves." },
  { id:"biography", type:"word", word:"biography", hl:"graph",
    def:"A true story of a person’s life, written by someone else.",
    parts:[["bio","life"],["graph","write",1],["y","a thing"]],
    ex:"I read a biography of Harriet Tubman for my book report." },
  { id:"photograph", type:"word", word:"photograph", hl:"graph",
    def:"A picture taken with a camera.",
    parts:[["photo","light"],["graph","draw",1]],
    ex:"Grandma keeps an old photograph of her school on the fridge." },
  { id:"telegraph", type:"word", word:"telegraph", hl:"graph",
    def:"An old machine that sent messages far away using electric signals and a code of dots and dashes.",
    parts:[["tele","far"],["graph","write",1]],
    ex:"Long ago, news traveled across the country by telegraph." },
  { id:"graph", type:"word", word:"graph", hl:"graph",
    def:"A drawing, like a bar graph or line graph, that shows numbers or information.",
    parts:[["graph","write, draw",1]],
    ex:"Our class made a graph of everyone’s favorite fruit." },
  { id:"autograph", type:"word", word:"autograph", hl:"graph",
    def:"A famous person’s signature, written by their own hand.",
    parts:[["auto","self"],["graph","write",1]],
    ex:"The author signed her autograph inside my book." },
  { id:"script", type:"word", word:"script", hl:"script",
    def:"The written words that actors say in a play, show or movie.",
    parts:[["script","written",1]],
    ex:"I practiced my lines from the script for the school play." },
  { id:"describe", type:"word", word:"describe", hl:"scribe",
    def:"To tell what something is like using words.",
    parts:[["de","down, fully"],["scribe","write",1]],
    ex:"Can you describe what your new puppy looks like?" },
  { id:"prescription", type:"word", word:"prescription", hl:"script",
    def:"A doctor’s written order for medicine.",
    parts:[["pre","before"],["script","written",1],["ion","act of"]],
    ex:"The doctor wrote a prescription and we picked it up at the pharmacy." },
  { id:"manuscript", type:"word", word:"manuscript", hl:"script",
    def:"Something written by hand, or a writer’s draft of a book before it is printed.",
    parts:[["manu","hand"],["script","written",1]],
    ex:"The museum showed a manuscript that was hundreds of years old." },
];

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let known = new Set(store.get("gs-known", []));
let set = store.get("gs-set", "all");
let dir = store.get("gs-dir", "word");
let deck = [], i = 0, flipped = false;

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function highlight(word, hl){
  if (word === hl) return `<span class="root-hl">${esc(word)}</span>`;
  const at = word.indexOf(hl);
  if (at < 0) return esc(word);
  return esc(word.slice(0, at)) + `<span class="root-hl">${esc(hl)}</span>` + esc(word.slice(at + hl.length));
}
const speakerIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;

function pool(){ return CARDS.filter(c => set === "all" || (set === "words" ? c.type === "word" : c.type === "root")); }
function buildDeck(shuffle){
  let p = pool();
  const learning = p.filter(c => !known.has(c.id));
  deck = learning.length ? learning : [];
  if (shuffle) deck.sort(() => Math.random() - .5);
  i = 0; flipped = false; render();
}

function render(){
  const p = pool();
  const k = p.filter(c => known.has(c.id)).length;
  $("known").textContent = `${k} of ${p.length} learned`;
  $("bar-fill").style.width = (p.length ? k / p.length * 100 : 0) + "%";
  document.querySelectorAll("[data-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.set === set));
  document.querySelectorAll("[data-dir]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir === dir));

  const empty = deck.length === 0;
  $("done").hidden = !empty; $("stage").hidden = empty; $("study").hidden = empty;
  if (empty){ $("count").textContent = "All done"; return; }

  if (i >= deck.length) i = 0;
  const c = deck[i];
  $("count").textContent = `Card ${i + 1} of ${deck.length}`;
  const label = c.type === "root" ? `<span class="pill">${c.origin}</span>` : "Spelling word";

  const wordSide = `<div class="tag">${label}</div>
    <div class="front-body"><div><div class="word">${esc(c.word)}</div></div><div class="hint">Tap to see what it means</div></div>`;
  const defSide = `<div class="tag">${label}</div>
    <div class="front-body"><div class="prompt-def">${esc(c.def)}</div><div class="hint">Which ${c.type === "root" ? "root" : "word"} is it? Tap to check.</div></div>`;

  const partsHtml = c.parts.map(([t, m, r]) => `<span class="part${r ? " root" : ""}"><b>${esc(t)}</b><small>${esc(m)}</small></span>`)
    .join('<span class="plus">+</span>');
  const answerSide = `<div class="tag">${label}</div>
    <div class="back-body">
      <div class="back-word">${highlight(c.word, c.hl)}</div>
      <p class="def">${esc(c.def)}</p>
      <div class="parts">${c.type === "root" ? c.parts.map(([t,m]) => `<span class="part root"><b>${esc(t)}</b><small>${esc(m)}</small></span>`).join("") : partsHtml}</div>
      <p class="example">${c.type === "root" ? "Find it in: " : ""}${esc(c.ex)}</p>
    </div>`;

  $("front").innerHTML = (dir === "word" ? wordSide : defSide) + `<span class="say" role="button" tabindex="0" aria-label="Say it out loud" data-say>${speakerIcon}</span>`;
  $("back").innerHTML = answerSide + `<span class="say" role="button" tabindex="0" aria-label="Say it out loud" data-say>${speakerIcon}</span>`;
  $("card").classList.toggle("flipped", flipped);
}

function speak(){
  const c = deck[i]; if (!c) return;
  try {
    speechSynthesis.cancel();
    const text = c.type === "root" ? c.word.replace("/", "or") : (flipped || dir === "word" ? `${c.word}. ${flipped ? c.def : ""}` : c.def);
    const u = new SpeechSynthesisUtterance(text); u.rate = .9;
    speechSynthesis.speak(u);
  } catch(e){}
}

function flip(){ flipped = !flipped; $("card").classList.toggle("flipped", flipped); }
function go(d){ if (!deck.length) return; i = (i + d + deck.length) % deck.length; flipped = false; render(); }
function mark(isKnown){
  const c = deck[i]; if (!c) return;
  if (isKnown){ known.add(c.id); deck.splice(i, 1); if (i >= deck.length) i = 0; }
  else { known.delete(c.id); deck.push(deck.splice(i, 1)[0]); if (deck.length === 1) i = 0; }
  store.set("gs-known", [...known]); flipped = false; render();
}

$("card").addEventListener("click", e => {
  if (e.target.closest("[data-say]")) { e.stopPropagation(); speak(); return; }
  flip();
});
$("card").addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("[data-say]") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); speak(); }
});
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("know").onclick = () => mark(true);
$("learn").onclick = () => mark(false);
$("shuffle").onclick = () => buildDeck(true);
$("restart").onclick = () => { pool().forEach(c => known.delete(c.id)); store.set("gs-known", [...known]); buildDeck(true); };
document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { set = b.dataset.set; store.set("gs-set", set); buildDeck(false); });
document.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { dir = b.dataset.dir; store.set("gs-dir", dir); flipped = false; render(); });

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && e.target.id !== "card" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " ") { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") mark(false);
  else if (e.key === "2") mark(true);
});

buildDeck(false);
</script>

</body>
</html>
